[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filr"
version = "0.1.0"
description = "A history-aware store of immutable drops for document management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "blake3>=0.4.0",
    "tomli-w>=1.0.0",
]

[project.scripts]
filr = "filr.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pre-commit>=3.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
